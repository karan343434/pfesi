<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF & ESI Return</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
        }
        .container {
            background: #ffffff;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            padding: 15px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #1a5dc8;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .error-message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" id="uploadContainer">
        <h1>PF & ESI Return Excel Upload App</h1>
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
        <button id="uploadButton">Upload</button>
        <button id="downloadSample">Download Sample Excel</button>
        <p id="errorMessage" class="error-message" style="display: none;"></p>
    </div>

    <script>
        document.getElementById('uploadButton').addEventListener('click', () => {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please upload an Excel file.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                
                if (!jsonData || jsonData.length === 0) {
                    alert("Uploaded file is empty or not formatted correctly.");
                    return;
                }
                
                const excelData = [
                    ["IP Number (10 Digits)", "IP Name", "Days Paid", "Total Monthly Wages", "Reason Code", "Last Working Day"]
                ];
                const payBillData = [
                    ["Receipts Sl. No.", "UAN", "Name", "Basic", "DA", "HRA", "Conveyance", "Gross Wage", "PF", "ESI", "Other 1", "Other 2", "Net Pay"]
                ];
                
                jsonData.slice(1).forEach((row, index) => {
                    const [ip_no, uan, name, basic, da, hra, conveyance, gross_wage, pf, esi, other1, other2] = row;
                    excelData.push([ip_no, name, 30, gross_wage, 0, "30/09/2024"]);
                    payBillData.push([
                        index + 1, uan, name, basic, da, hra, conveyance, gross_wage, pf, esi, other1, other2,
                        gross_wage - pf - esi - other1 - other2
                    ]);
                });
                
                const wb = XLSX.utils.book_new();
                const ws1 = XLSX.utils.aoa_to_sheet(excelData);
                const ws2 = XLSX.utils.aoa_to_sheet(payBillData);
                XLSX.utils.book_append_sheet(wb, ws1, "Updated Data");
                XLSX.utils.book_append_sheet(wb, ws2, "Pay Bill");
                XLSX.writeFile(wb, 'updated_data.xlsx');
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
